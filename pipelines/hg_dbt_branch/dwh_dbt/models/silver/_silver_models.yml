version: 2

# HG-style column tests. `dbt test` runs after `dbt run` on every stage of an owned project and
# a failing test fails the stage (docs/hg-fact-artist-assignment.md); the pipeline's gates check
# the same keys again.
models:
  - name: dim_artist
    columns:
      - name: dim_artist_sk
        tests: [unique, not_null]
  - name: dim_artist_active
    columns:
      - name: dim_artist_sk
        tests: [unique, not_null]
