# The BRD above deliberately omits: which date defines the month, whether cancelled /
# draft orders count, tax inclusive or not, and how currencies combine. A correct draft
# must ask, not choose. There is no fixture/expected: nothing may be built from this BRD yet.
name: a3_revenue_ambiguous
kind: ambiguous
warehouse_schema: a3_revenue_ambiguous
# The harness deploys the validated draft for real against throwaway databases, so it uses
# its own warehouse refs: dpagent's standard WAREHOUSE_DB_* are shared by every pipeline on
# a host and must never be pointed at a throwaway database (undeploy rightly keeps a secret
# another published pipeline still uses).
warehouse_refs:
  host: "${A3_WH_HOST:-localhost}"
  port: "${A3_WH_PORT:-5432}"
  database: "${A3_WH_NAME:-warehouse}"
  user: "${A3_WH_USER}"
  password: "${A3_WH_PASSWORD}"
secrets:
  A3_SRC_HOST: source Postgres host
  A3_SRC_PORT: source Postgres port
  A3_SRC_NAME: source database name
  A3_SRC_USER: source database user
  A3_SRC_PASSWORD: source database password
hint: ""
