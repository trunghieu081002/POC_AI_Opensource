# The BRD is precise; the SOURCE is a MongoDB collection, and no connector reads MongoDB (catalog:
# odoo_postgres, csv, rest_api, sql_server, elasticsearch, google_sheets). A correct draft
# reports the missing capability instead of guessing a connector. There is no fixture/expected.
name: a3_fulfilment_sla_mongodb
kind: ambiguous
warehouse_schema: a3_fulfilment_sla_mongodb
# The harness deploys the validated draft for real against throwaway databases, so it uses
# its own warehouse refs: dpagent's standard WAREHOUSE_DB_* are shared by every pipeline on
# a host and must never be pointed at a throwaway database (undeploy rightly keeps a secret
# another published pipeline still uses).
warehouse_refs:
  host: "${A3_WH_HOST:-localhost}"
  port: "${A3_WH_PORT:-5432}"
  database: "${A3_WH_NAME:-warehouse}"
  user: "${A3_WH_USER}"
  password: "${A3_WH_PASSWORD}"
secrets:
  A3_SRC_MONGO_URI: MongoDB connection string of the order service (read-only user)
hint: ""
