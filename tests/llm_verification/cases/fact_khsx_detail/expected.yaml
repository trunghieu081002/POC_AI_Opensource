# Calculated by hand from fixture.yaml and brd.md - never read back from any pipeline's output, and
# the model never sees it (tests/test_llm_verify.py recomputes it from the fixture independently).
#   one row per source row, none dropped -> 7 rows
#   fact_khsx_detail_sk = dbt_utils.generate_surrogate_key(['id'])
#                       = md5(coalesce(cast(id as text), '_dbt_utils_surrogate_key_null_')) = md5('<id>')
#                         (hashes computed with Python hashlib.md5)
#   every other column: the value as text, trimmed; NULL / '' / whitespace-only -> NULL
#     4280 "  approved  " -> approved; 4308 "   " -> NULL, plan/manager NULL; 4229 state NULL -> NULL;
#     4307 ar_id NULL -> NULL; 4400 cancel is kept
table: fact_khsx_detail
schema: silver
row_count: 7
# BRD "Kiểm tra chất lượng": these dbt tests must run and pass, with severity error - checked by A2
# in the journal (test name / column / model / severity as dbt's manifest describes them)
required_dbt_tests:
  - {model: fact_khsx_detail, column: fact_khsx_detail_sk, tests: [unique, not_null], severity: error}
# BRD: exactly these six columns, all text - no other source column carried over
