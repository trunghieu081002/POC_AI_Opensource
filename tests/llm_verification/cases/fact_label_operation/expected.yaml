# Calculated by hand from fixture.yaml and brd.md - never read back from any pipeline's output; the model never
# sees it (tests/test_llm_label_operation.py recomputes it from the fixture with an independent Python version).
#   1. filter: active = true AND trim(isrc) non-empty  -> drops 90, 103 (inactive), 112 (active NULL), 104/105/106
#   2. LEFT JOIN certificates on purchase_order_id     -> 107 (order 5999) and 108 (no order) kept, url NULL
#   3. one row per RAW isrc, smallest id:
#        "VNA012300001": 101, 102 -> 101         "VNA012300002": 150, 120 -> 120 (90 was filtered out)
#        " VNA012300005 " -> 109 and "VNA012300005" -> 110: two groups, both kept
#   4. text: trimmed, NULL/''/blank -> NULL; release_date -> timestamp; distro 12 (double) -> "12"
#      sk = md5(cast(id as text)) (dbt_utils.generate_surrogate_key(['id']); hashes from Python hashlib.md5)
#      101 uses cert 5001 " https://cert.hg/5001 " -> trimmed; 120 uses cert 5003 "   " -> NULL
table: fact_label_operation
schema: silver
row_count: 7
required_dbt_tests:
  - {model: fact_label_operation, column: fact_label_operation_sk, tests: [unique, not_null], severity: error}
# brd.md "Nhiều chứng nhận ... blocker B1": the run must FAIL rather than pick a certificate
required_gates:
  - {stage: landing, type: unique, table: x_acceptance_cert, columns: [purchase_order_id]}
columns: {fact_label_operation_sk: text, resource_id: text, release_status: text,
          release_date: timestamp without time zone, acceptance_url: text, isrc: text, distributor: text}
