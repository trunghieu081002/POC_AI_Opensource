# Calculated from fixture.yaml and the seed by tests/hg_resources_reference.py - an independent, naive Python
# implementation of HG's models that never reads a pipeline's output; tests/test_hg_resources_useage_number.py
# recomputes this file from it, and the rows below were also checked by hand:
#   gold: 13 resource x video pairs of the 4 published videos that have resources.
#     V1  (ED1)  HGFA0001 1 | HGFA0002 2 | HGFA0007 3         - HGFA000164B5... (seed) takes NO position
#     V2/V7 (ED2) HGFA0002 1 | HGFA0001 1                     - V2 and V7 share a cut; r-1 is 2nd in e-2 but 1st in
#                                                               e-6 (same ED2 code) -> the smaller, 1
#     V8  (ED3)  HGFA0001 1 | 0002 2 | 0007 3 | 0009 4 | 0008 5 | 0010 6   - 0008/0009 tie on StartTime -> by Id
#   left out: V3 (not published), V5 (no editing code), V6 (cut without resources), V4 (other company), blank id,
#   V9 (channel link deleted), ResourceType 1, non-HGFA codes, the 5 787 seed codes.
#   dim_video 7 rows (V1 keeps its newest copy; " V7 " keeps its spaces in the key, trimmed in video_id);
#   fact_editing 13 rows (the exact duplicate of resource_editing x1 collapsed).
#   published_date assumes the database session time zone is UTC (the PublishedAt values are +00).
