name: a3_artist_summary
summary: Báo cáo tổng hợp nghệ sĩ từ bảng res_partner
source:
  connector: odoo_postgres
  connection:
    host: ${A3_SRC_HOST}
    port: ${A3_SRC_PORT}
    database: ${A3_SRC_NAME}
    user: ${A3_SRC_USER}
    password: ${A3_SRC_PASSWORD}
  tables:
  - public.res_partner
warehouse:
  host: ${A3_WH_HOST:-localhost}
  port: ${A3_WH_PORT:-5432}
  database: ${A3_WH_NAME:-warehouse}
  user: ${A3_WH_USER}
  password: ${A3_WH_PASSWORD}
  schema: a3_artist_summary
stages:
- name: landing
  gates:
  - type: schema_contract
    tables:
    - a3_artist_summary_landing.res_partner
  - type: row_count_bounds
    table: a3_artist_summary_landing.res_partner
    min: 1
- name: curated
  engine: dbt
  depends_on: landing
  models:
  - artist_summary
  gates:
  - type: not_null
    table: artist_summary
    columns:
    - artists
    - distinct_names
    - min_id
    - max_id
  - type: row_count_bounds
    table: artist_summary
    min: 1
    max: 1
