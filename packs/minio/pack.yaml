name: minio
version: 1.0.0
summary: MinIO single-node object storage server, run as a systemd service
maturity: draft            # flip to stable once it has verified on a real host

provides: [minio, object_storage, s3]
requires: [base]

supports:
  families: [debian, rhel]

host_needs:
  disk_mb: { /opt: 2048 }

params:
  # MinIO's own releases are date-tagged (RELEASE.<timestamp>), not simple
  # majors - empty means "the current stable build", the same non-versioned
  # URL MinIO's own systemd install guide uses. Set a RELEASE.* tag here to
  # pin one instead, the same reason postgres pins a major version by default.
  release:
    type: string
    default: ""
  install_dir:
    type: string
    default: "/opt/minio"
  data_dir:
    type: string
    default: "/opt/minio/data"
  port:
    type: int
    default: 9000            # S3 API
  console_port:
    type: int
    default: 9001            # web console
  root_user:
    type: string
    default: "minio_admin"
  root_password:
    type: string
    required: true
    secret: true
  open_firewall:
    type: bool
    default: false

preflight: preflight.sh
verify: verify.sh
rollback: rollback.sh
detect: detect.sh
errors: errors.yaml

steps:
  - id: user
    script: steps/10-user.sh
    description: Create the minio system user, install_dir and data_dir
    timeout: 60
    guard: >
      id -u minio >/dev/null 2>&1 &&
      test -d "$DP_PARAM_INSTALL_DIR/bin" &&
      test -d "$DP_PARAM_DATA_DIR"

  - id: install
    script: steps/20-install.sh
    description: Download the minio server binary
    timeout: 600
    guard: 'test -x "$DP_PARAM_INSTALL_DIR/bin/minio"'

  - id: config
    script: steps/30-config.sh
    description: Write the MINIO_ROOT_USER/PASSWORD and address environment file
    timeout: 60

  - id: services
    script: steps/40-services.sh
    description: Install and start the minio systemd unit
    timeout: 300
