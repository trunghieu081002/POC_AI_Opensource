name: seaweedfs
version: 1.0.0
summary: SeaweedFS as a single S3-compatible object store (one `weed server`), bound to localhost by default
maturity: draft          # flips to stable after it has verified on a real host and a human promotes it

provides: [object-storage, s3]
requires: [base]

supports:
  families: [debian, rhel]

host_needs:
  memory_mb: 1024
  disk_mb: { /var/lib: 2048, /opt: 256 }

params:
  version:
    type: string
    default: "4.48"
  # sha256 of the release tarball for each CPU architecture. Pinned here, next
  # to the version, so changing `version` without changing these fails the
  # install instead of installing something nobody reviewed. Taken from the
  # digests GitHub publishes for release 4.48's linux_<arch>.tar.gz assets.
  sha256_amd64:
    type: string
    default: "4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124"
  sha256_arm64:
    type: string
    default: "557e92c38c5c7d180748eb8e2b2b45e426f8e5282a4caca8e098a90d09f03a07"
  install_dir:
    type: string
    default: "/opt/seaweedfs"
  data_dir:
    type: string
    default: "/var/lib/seaweedfs"
  s3_port:
    type: int
    default: 8333
  # Not 0.0.0.0: an object store with a shared key on every interface is the
  # thing an install should have to be asked for. Pipelines on this host reach
  # it on loopback.
  bind_address:
    type: string
    default: "127.0.0.1"
  volume_size_limit_mb:
    type: int
    default: 1024
  # Every S3 bucket is a SeaweedFS "collection" with its own volumes. weed's
  # defaults (8 volume slots, 7 volumes grown at once for a new collection)
  # mean the FIRST bucket takes every slot and the second bucket cannot be
  # written at all ("create 7 volume, created 0: Not enough data nodes
  # found" -> HTTP 500 on PutObject). Found by running a pipeline's bucket
  # next to the acceptance suite's on a clean host. Volumes are sparse until
  # written, so many slots cost nothing; growing one volume at a time keeps a
  # new bucket cheap.
  volume_max:
    type: int
    default: 100
  volume_growth_count:
    type: int
    default: 1
  access_key:
    type: string
    required: true
    secret: true
  secret_key:
    type: string
    required: true
    secret: true
  buckets:
    type: list
    default: []

preflight: preflight.sh
verify: verify.sh
rollback: rollback.sh
detect: detect.sh
errors: errors.yaml

steps:
  - id: user
    script: steps/10-user.sh
    description: Create the seaweedfs system user and its directories
    timeout: 60
    guard: 'id -u seaweedfs >/dev/null 2>&1 && test -d "$DP_PARAM_DATA_DIR" && test -d "$DP_PARAM_INSTALL_DIR/bin"'

  - id: install
    script: steps/20-install.sh
    description: Download the pinned release, verify its sha256, install the weed binary
    timeout: 600
    guard: 'test -x "$DP_PARAM_INSTALL_DIR/bin/weed" && "$DP_PARAM_INSTALL_DIR/bin/weed" version 2>/dev/null | grep -q "$DP_PARAM_VERSION"'

  - id: config
    script: steps/30-config.sh
    description: Write the S3 identity file and the root-only credentials file the suite reads
    timeout: 30
    # Not guarded: must always reflect the current access_key/secret_key.

  - id: service
    script: steps/40-service.sh
    description: Install and start the seaweedfs systemd unit
    timeout: 180

  - id: buckets
    script: steps/50-buckets.sh
    description: Create the requested buckets
    timeout: 120
