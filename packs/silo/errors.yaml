# Silo-specific failures. Generic ones (DNS, disk, apt locks) live in
# packs/_lib/errors.yaml and are checked after these.
#
# Every entry earns its place by having actually happened. When a failure
# gets past this file, `dpagent diagnose` drafts a new entry into
# errors.proposed.yaml for review - move it here and this pack never needs a
# human for it again.

- id: silo-dlminio-410-gone
  match:
    output: "dl\\.min\\.io.*410|The requested URL returned error: 410"
  cause: >
    MinIO's own open-source server was archived in 2026 and dl.min.io
    stopped serving binaries entirely around 2026-09-11 - this is the exact
    failure that made this pack switch to github.com/pgsty/silo (see
    steps/20-install.sh's own comment). Something is still pointing at the
    old dl.min.io URL.
  autofix: []
  ask_user: >
    This pack should never reach dl.min.io - if it did, a param or a local
    edit reintroduced the old URL. Re-run `dpagent lint silo` and check
    steps/20-install.sh has not been hand-edited back to it.
  retry: false

- id: silo-port-busy
  match:
    output: "bind: address already in use|Specified port .* is already in use"
  cause: Another process already holds the S3 API or console port.
  autofix: []
  ask_user: >
    The port is occupied. Stop the other service, or re-run with a
    different port/console_port param, e.g.
    `dpagent install silo --set port=9010`.
  retry: false

- id: silo-conflicts-with-minio-service
  match:
    output: "Conflicts with unit minio\\.service|Job for silo\\.service failed"
  cause: >
    silo.service explicitly Conflicts= an existing minio.service unit (a
    leftover from an earlier draft of this pack, or a manual MinIO install)
    - systemd refuses to run both.
  autofix: []
  ask_user: >
    Stop and remove the old unit first: `systemctl disable --now minio`,
    `rm /etc/systemd/system/minio.service` (only if dpagent did not install
    it - `dpagent rollback minio` if it did), `systemctl daemon-reload`,
    then re-run this install.
  retry: false

- id: silo-download-404
  match:
    output: "404 Not Found|The specified key does not exist"
  cause: >
    The `release` param names a RELEASE.<timestamp> tag that
    github.com/pgsty/silo's releases do not have (a typo, or a tag that
    predates/postdates what this pack's URL-construction logic expects).
  autofix: []
  ask_user: >
    That release tag was not found. Leave `release` unset for the version
    this pack was written against, or check
    https://github.com/pgsty/silo/releases for a valid RELEASE.* tag.
  retry: false

- id: silo-root-credentials-too-short
  match:
    output: "MINIO_ROOT_PASSWORD.*length should be|Root password length|password.*too short"
  cause: >
    The underlying server requires the root password to be at least 8
    characters; the root_password param is shorter than that.
  autofix: []
  ask_user: "Set a root_password of at least 8 characters and re-run."
  retry: false
