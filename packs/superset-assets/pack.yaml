name: superset-assets
version: 0.1.0
summary: Validate and deploy project-owned Superset assets through native UUID-based import
maturity: draft
provides: [superset-assets]
requires: [superset]
supports:
  families: [debian, rhel]
params:
  base_url: {type: string, default: "http://127.0.0.1:8088"}
  environment: {type: string, default: "dev"}
  mode: {type: string, default: "validate", enum: [validate, deploy, undeploy]}
  approved_by: {type: string, default: ""}
  projects: {type: list, required: true}
preflight: preflight.sh
verify: verify.sh
rollback: rollback.sh
detect: detect.sh
errors: errors.yaml
steps:
  - id: reconcile-projects
    script: steps/10-projects.sh
    description: Validate isolated clones, require content-bound approval and reconcile owned UUIDs
    timeout: 1200
